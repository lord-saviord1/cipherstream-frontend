<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CipherStream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo">CIPHER<span>STREAM</span></h1>
    <div class="topbar-right">
      <div id="authStatus" class="pill">not signed in</div>
      <button id="logoutBtn" class="logout-btn hidden">Log out</button>
    </div>
  </header>

  <main id="authView" class="auth-view">
    <div class="auth-card">
      <h2>Sign up / Log in</h2>
      <form id="signupForm">
        <input type="text" id="su-name" placeholder="Name" required />
        <input type="email" id="su-email" placeholder="Email" required />
        <input type="password" id="su-password" placeholder="Password" required />
        <button type="submit">Sign up</button>
      </form>
      <form id="loginForm">
        <input type="email" id="li-email" placeholder="Email" required />
        <input type="password" id="li-password" placeholder="Password" required />
        <button type="submit" class="secondary">Log in</button>
      </form>
      <p id="authMsg" class="msg"></p>
    </div>
  </main>

  <main id="appView" class="app-view hidden">

    <section class="section live-section">
      <div class="section-head">
        <h2>Live TV</h2>
        <span class="section-sub">on air now — tap a number to watch</span>
      </div>
      <div id="liveGrid" class="live-grid"></div>
    </section>

    <section class="section ondemand-section">
      <div class="section-head">
        <h2>On Demand</h2>
        <span class="section-sub">watch anytime</span>
      </div>
      <div id="ondemandRows"></div>
    </section>

  </main>

  <div id="playerOverlay" class="player-overlay hidden">
    <div class="player-box">
      <div class="player-topbar">
        <span id="nowPlaying">—</span>
        <button id="closePlayer" class="close-btn">✕</button>
      </div>
      <div class="video-wrap">
        <video id="video" controls playsinline></video>
        <div id="playOverlayBtn" class="play-overlay-btn hidden">
          <div class="play-triangle"></div>
        </div>
        <div id="loadingSpinner" class="loading-spinner hidden"></div>
      </div>
      <p id="playerMsg" class="msg"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
